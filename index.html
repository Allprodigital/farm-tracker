<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Tracker</title>
<meta name="description" content="Farm Tracker by All Pro Digital: field status, next steps, notes, spray and harvest records, tractor maintenance, voice notes and photos.">
<meta name="theme-color" content="#1F3A24">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="print.css" media="print">
</head>
<body>
<div id="splash" role="status" aria-label="Farm Tracker by All Pro Digital">
  <img src="icons/icon.svg" alt="" width="132" height="132">
  <div class="splash-name">Farm Tracker</div>
  <div class="splash-by">by All Pro Digital</div>
</div>
<header class="top">
  <a class="brand" href="#/"><img src="icons/icon.svg" alt="" width="36" height="36"><span>Farm Tracker</span></a>
  <button type="button" id="bell" class="bell" aria-label="Alerts" aria-haspopup="dialog" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="bell-badge" hidden></span></button>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Main">
  <a href="#/"><svg class="t-ico" aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Home</a>
  <a href="#/fields"><svg class="t-ico" aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>All Fields</a>
  <a href="#/tractors"><svg class="t-ico" aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="3.5"/><circle cx="18" cy="18" r="2.5"/><path d="M4 13V7h7l2 6"/><path d="M13 13h7v5"/><path d="M16 13V9"/><path d="M8 7V4"/></svg>Tractors</a>
  <a href="#/about"><svg class="t-ico" aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/></svg>About</a>
</nav>
<div id="sheet" class="sheet hidden" aria-hidden="true"><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="bell-panel" class="bell-panel hidden" role="dialog" aria-label="Alerts"></div>
<div id="voice" class="voice-panel hidden" role="dialog" aria-live="polite"></div>
<div id="viewer" class="viewer hidden" role="dialog" aria-label="Photo"></div>
<div id="print" aria-hidden="true"></div>
<input type="file" id="cam-input" accept="image/*" capture="environment" hidden>
<input type="file" id="lib-input" accept="image/*" multiple hidden>
<input type="file" id="restore-input" accept=".json,application/json" hidden>
<script src="lib/photos.js"></script>
<script src="lib/voice.js"></script>
<script src="lib/reminders.js"></script>
<script src="lib/backup.js"></script>
<script src="lib/print.js"></script>
<script src="lib/welcome.js"></script>
<script src="lib/weather.js"></script>
<script src="app.js"></script>
</body>
</html>
